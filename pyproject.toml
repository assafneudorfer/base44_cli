[project]
name = "base44-cli"
version = "0.1.0"
description = "Comprehensive CLI for Base44 platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Base44 CLI Contributors" }
]
license = { text = "MIT" }
keywords = ["base44", "cli", "baas", "backend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-httpx>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
base44 = "base44_cli.main:app"

[project.urls]
Homepage = "https://github.com/yourusername/base44-cli"
Documentation = "https://github.com/yourusername/base44-cli#readme"
Repository = "https://github.com/yourusername/base44-cli"
Issues = "https://github.com/yourusername/base44-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=base44_cli --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
